<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCF Wochenmenü</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;0,800;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#16323a; --blue:#2e5d9e; --muted:#5b6b6e; --page:#0f1b1e; }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--page);color:#e9eef0;
    font-family:'Cormorant Garamond',Georgia,serif;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:14px 14px 40px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;
    padding:12px;margin-bottom:16px;background:rgba(255,255,255,.04);
    border:1px solid rgba(255,255,255,.08);border-radius:14px}
  .bar h1{flex:1 1 100%;text-align:center;margin:0 0 4px;font-family:'Playfair Display',serif;
    font-weight:700;font-size:20px;letter-spacing:.5px;color:#fff}
  label.sel{display:flex;align-items:center;gap:8px;font-size:17px;color:#cfe0e4}
  select{font:inherit;font-size:16px;padding:8px 12px;border-radius:10px;
    border:1px solid rgba(255,255,255,.18);background:#0e2329;color:#fff}
  button{font-family:'Playfair Display',serif;font-weight:700;font-size:15px;letter-spacing:.3px;
    border-radius:11px;padding:10px 16px;cursor:pointer;background:rgba(255,255,255,.08);
    color:#dfeaec;border:1px solid rgba(255,255,255,.16)}
  button:active{transform:translateY(1px)}
  .stage{display:flex;justify-content:center}

  /* ===== THE POSTER ============================================= */
  .poster{
    --fit:1;                                   /* auto-fit multiplier */
    position:relative; width:min(560px,94vw); aspect-ratio:1236/1600;
    container-type:inline-size;
    background-image:var(--bg); background-size:cover; background-position:center;
    border-radius:6px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .card{
    position:absolute; inset:5.2% 4.8%; background:#fff;
    border:1px solid rgba(20,40,46,.10); overflow:hidden;
    padding:4.4cqi 5.4cqi 3.6cqi;
    font-size:calc(4cqi * var(--fit));         /* base unit; everything below in em */
  }
  .card-inner{ width:100%; height:100%; display:flex; flex-direction:column; align-items:center; }
  .logo{ width:3.3em; height:auto; margin-top:.15em; }
  .title{ font:800 2.1em/1 'Playfair Display',serif; letter-spacing:.05em; color:var(--ink); margin:.32em 0 0; }
  .range{ font:700 .82em/1 'Playfair Display',serif; letter-spacing:.12em; color:var(--blue);
    text-transform:uppercase; margin-top:.7em; }
  .time{ font:500 .82em/1 'Playfair Display',serif; letter-spacing:.06em; color:var(--ink);
    text-transform:uppercase; margin-top:.32em; }
  .days{ flex:1; align-self:stretch; display:flex; flex-direction:column;
    justify-content:space-evenly; text-align:center; padding:.4em 0 0;
    margin-bottom:1.2em;            /* finish just above the Teamleitung line */
    min-height:0; }
  .day-label{ font:500 .82em/1 'Playfair Display',serif; letter-spacing:.14em; color:var(--blue);
    text-transform:uppercase; }
  .dish{ font:italic 700 1.12em/1.1 Arial,'Helvetica Neue',Helvetica,sans-serif; color:var(--ink); margin:.22em 0 .12em; }
  .cooks{ font:italic 500 .74em/1.05 'Cormorant Garamond',serif; color:var(--muted); }
  .footer{ align-self:flex-end; font:italic 600 .74em/1 'Cormorant Garamond',serif;
    color:var(--muted); margin-top:.45em; }
  .status{ margin:14px auto 0; max-width:560px; text-align:center; font-size:16px; color:#9fb3b7; }
  .status .err{ color:#ffb4b4; }

  @media print{
    html,body{background:#fff} .wrap{padding:0} .bar,.status{display:none}
    .poster{box-shadow:none; width:100%; max-width:none; border-radius:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <h1>TCF — Wochenmenü</h1>
    <label class="sel">Woche <select id="weekSelect"></select></label>
    <button id="printBtn">Drucken</button>
  </div>
  <div class="stage">
    <div class="poster" id="poster">
      <div class="card"><div class="card-inner" id="card"><!-- generated --></div></div>
    </div>
  </div>
  <p class="status" id="status">Lädt…</p>
</div>

};

/* ---- helpers --------------------------------------------------------- */
const DAY_ORDER=["Mo","Di","Mi","Do","Fr","Sa","So"];
const DAY_FULL={Mo:"MONTAG",Di:"DIENSTAG",Mi:"MITTWOCH",Do:"DONNERSTAG",Fr:"FREITAG",Sa:"SAMSTAG",So:"SONNTAG"};
const MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function normTW(tw){ if(!tw) return ''; tw=tw.toString().trim().replace(/\s*-\s*/,'–'); return /uhr/i.test(tw)?tw:tw+' Uhr'; }
function mode(a){ const m={}; let b='',n=0; a.forEach(v=>{m[v]=(m[v]||0)+1; if(m[v]>n){n=m[v];b=v;}}); return b; }
function parseDate(s){ const p=(s||'').toString().split('.'); if(p.length<3) return null; const d=new Date(+p[2],+p[1]-1,+p[0]); return isNaN(d)?null:d; }
function rangeOf(ev){ const ds=ev.map(e=>parseDate(e.date)).filter(Boolean).sort((a,b)=>a-b); if(!ds.length) return '';
  const a=ds[0],b=ds[ds.length-1];
  return a.getMonth()===b.getMonth()? `${a.getDate()}. – ${b.getDate()}. ${MONTHS[b.getMonth()]}`
    : `${a.getDate()}. ${MONTHS[a.getMonth()]} – ${b.getDate()}. ${MONTHS[b.getMonth()]}`; }
function rangeStart(ev,kw){ const ds=ev.filter(e=>e.kw===kw).map(e=>parseDate(e.date)).filter(Boolean).sort((a,b)=>a-b); return ds[0]; }

/* ---- getEvents[] (+ teamData[]) -> [week,…] -------------------------- */
function buildWeeks(events, teamData){
  const kws=[...new Set(events.map(e=>e.kw))];
  return kws.map(kw=>{
    const all=events.filter(e=>e.kw===kw);
    // Consider every BOOKED row (has a name OR a dish). We must NOT drop rows
    // whose menu cell is empty: a second co-cook often books the same slot but
    // only the first person types the dish into column M. Group by day + time
    // slot, take the dish from whichever row in the slot has one, and collect
    // ALL names. So co-cooks merge ("X und Y") regardless of who filled M;
    // genuinely different dishes/slots on a day still render as separate lines.
    const booked=all.filter(e=>(e.name||'').trim() || (e.menu||'').trim());
    const groups={};                       // key -> {day, dish, tw, cooks[], order}
    booked.forEach((e,idx)=>{
      const dish=(e.menu||'').trim();
      const tw=normTW(e.timeWindow);
      // primary key = day + time slot; dish disambiguates only if two truly
      // different dishes share one slot.
      let key=e.day+'|'+tw;
      const existing=groups[key];
      if(existing && existing.dish && dish && existing.dish.toLowerCase()!==dish.toLowerCase()){
        key=key+'|'+dish.toLowerCase();      // distinct dish in same slot -> own line
      }
      if(!groups[key]) groups[key]={day:e.day, dish, tw, cooks:[], order:idx};
      if(dish && !groups[key].dish) groups[key].dish=dish;   // fill dish if missing
      if((e.name||'').trim()) groups[key].cooks.push(e.name.trim());
    });
    // a slot with names but no dish at all isn't ready -> don't show it
    const ready=Object.values(groups).filter(g=>g.dish);
    const menuTWs=ready.map(g=>g.tw).filter(Boolean);
    const defaultTime=mode(menuTWs)||'18–22 Uhr';
    const di=d=>DAY_ORDER.indexOf(d);
    const days=ready
      .sort((a,b)=> di(a.day)-di(b.day) || a.tw.localeCompare(b.tw) || a.order-b.order)
      .map(g=>({day:DAY_FULL[g.day]||g.day, dish:g.dish,
                cooks:[...new Set(g.cooks)].join(' und '),
                time:(g.tw && g.tw!==defaultTime)?g.tw:null}));
    const team=(teamData||[]).find(t=>t.kw===kw);
    return {kw, range:rangeOf(all), defaultTime, teamleiter:team?team.name:'', days, hasMenu:days.length>0};
  }).sort((x,y)=>(rangeStart(events,x.kw)||0)-(rangeStart(events,y.kw)||0));
}

/* ---- mock fallback (your KW 21 poster) ------------------------------- */
const MOCK=[{kw:"21",range:"18. – 24. Mai",defaultTime:"18–22 Uhr",teamleiter:"Simona Chlepcsok",hasMenu:true,days:[
  {day:"MONTAG",dish:"Tomate-Mozzarella-Toast mit Pesto",cooks:"Melanie Dürr",time:null},
  {day:"DIENSTAG",dish:"Maultaschen mit Kartoffelsalat",cooks:"Martina Hieber",time:null},
  {day:"MITTWOCH",dish:"Fleischkäse mit Kartoffelsalat",cooks:"Simon Karl und Tom Retter",time:null},
  {day:"DONNERSTAG",dish:"Italienischer Nudelsalat mit Baguette",cooks:"Jean Schieck",time:null},
  {day:"FREITAG",dish:"Pizza-Brötchen",cooks:"Jean Schieck",time:null},
  {day:"SONNTAG",dish:"Zitronen-Mohn-Kuchen",cooks:"Aleaxandra Brenner-Binder",time:"14–18 Uhr"}
]}];

/* ---- render + auto-fit ----------------------------------------------- */
function esc(s){ return (s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function renderWeek(w){
  const card=document.getElementById('card');
  let prevDay='';
  const days=w.days.map(d=>{
    const sameAsPrev = d.day===prevDay;   // 2nd+ line of the same weekday
    prevDay=d.day;
    const label = sameAsPrev
      ? (d.time?`(${esc(d.time)})`:'')               // repeat: time only
      : `${esc(d.day)}${d.time?` (${esc(d.time)})`:''}`;
    return `
    <div class="day">
      ${label?`<div class="day-label">${label}</div>`:''}
      <div class="dish">${esc(d.dish)}</div>
      ${d.cooks?`<div class="cooks">von ${esc(d.cooks)}</div>`:''}
    </div>`;
  }).join('');
  card.innerHTML=`
    <img class="logo" src="${CONFIG.logo}" alt="TCF">
    <div class="title">BEWIRTUNG</div>
    <div class="range">Angebot vom ${esc(w.range)}</div>
    <div class="time">${esc(w.defaultTime)}</div>
    <div class="days">${days}</div>
    ${w.teamleiter?`<div class="footer">Teamleitung: ${esc(w.teamleiter)}</div>`:''}`;
  scheduleFit(card);
}
/* run autoFit now AND after the things that change text metrics settle:
   layout (rAF), web-font swap (fonts.ready), and logo decode (img load).
   First paint may use fallback fonts/0-height logo, so re-measuring is what
   stops the first-load overlap. */
function scheduleFit(card){
  autoFit();
  requestAnimationFrame(()=>{ autoFit(); requestAnimationFrame(autoFit); });
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(autoFit);
  const logo=card&&card.querySelector('.logo');
  if(logo && !logo.complete) logo.addEventListener('load', autoFit, {once:true});
}
/* shrink the base unit until all days fit inside the card */
function autoFit(){
  const poster=document.getElementById('poster');
  const days=poster&&poster.querySelector('.days');
  if(!days) return;
  let f=1, guard=0;
  poster.style.setProperty('--fit', f);
  while(days.scrollHeight > days.clientHeight+1 && f>0.45 && guard<60){
    f-=0.03; poster.style.setProperty('--fit', f.toFixed(3)); guard++;
  }
}

/* ---- boot ------------------------------------------------------------ */
let WEEKS=[];
function populate(weeks){
  WEEKS=weeks;
  const pick=weeks.filter(w=>w.hasMenu), list=pick.length?pick:weeks;
  const sel=document.getElementById('weekSelect'); sel.innerHTML='';
  list.forEach(w=>{ const o=document.createElement('option');
    o.value=w.kw; o.textContent=`KW ${w.kw}${w.range?'  ·  '+w.range:''}`; sel.appendChild(o); });
  const byKw=Object.fromEntries(WEEKS.map(w=>[w.kw,w]));
  sel.onchange=()=>renderWeek(byKw[sel.value]);
  renderWeek(list[0]);
}
async function init(){
  const status=document.getElementById('status');
  document.getElementById('printBtn').onclick=()=>window.print();
  window.addEventListener('resize', autoFit);
  // load the exact faces we measure against, so first-load fit is correct
  try{
    await Promise.all([
      document.fonts.load("800 40px 'Playfair Display'"),
      document.fonts.load("700 40px 'Playfair Display'"),
      document.fonts.load("500 40px 'Playfair Display'"),
      document.fonts.load("italic 500 40px 'Cormorant Garamond'"),
      document.fonts.load("italic 600 40px 'Cormorant Garamond'")
    ]);
  }catch(e){}
  try{
    const [ev,tl]=await Promise.all([
      fetch(`${API}?action=getEvents`).then(r=>r.json()),
      fetch(`${API}?action=getTeamleiter`).then(r=>r.json())
    ]);
    const weeks=buildWeeks(ev,tl).filter(w=>w.range||w.hasMenu);
    if(!weeks.length) throw new Error('no data');
    populate(weeks);
    status.textContent='Live aus dem Google Sheet. Teilen: Screenshot in die WhatsApp-Gruppe.';
  }catch(err){
    populate(MOCK);
    status.innerHTML='<span class="err">Live-Daten nicht erreichbar – Vorschau mit Beispielwoche (KW 21).</span>';
  }
}
window.addEventListener('load', autoFit);
init();
</script>
