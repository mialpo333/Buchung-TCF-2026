<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Buchungssystem</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;
        const API_URL = 'https://script.google.com/macros/s/AKfycbysropLQ4xvGWebf0FoReC7Q0nO6eOeyYflE9Hkg1oAbYQsasGDlCMlXkcixdxMUx-x/exec';

        function App() {
            const [events, setEvents] = useState([]);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('book');
            const [selectedWeek, setSelectedWeek] = useState('');
            const [selectedSlot, setSelectedSlot] = useState(null);
            const [bookingType, setBookingType] = useState('participant');
            const [customerName, setCustomerName] = useState('');
            const [customerEmail, setCustomerEmail] = useState('');
            const [customerPhone, setCustomerPhone] = useState('');
            const [message, setMessage] = useState({ type: '', text: '' });
            const [managementEmail, setManagementEmail] = useState('');
            const [language, setLanguage] = useState('de');

            const t = language === 'de' ? {
                title: 'Event Buchungssystem',
                subtitle: 'Buchen Sie Ihre Teilnahme an Events',
                makeBooking: 'Teilnahme Buchen',
                manageBookings: 'Meine Buchungen',
                selectWeek: 'Kalenderwoche wählen',
                selectKW: 'KW auswählen',
                allSlots: 'Alle Slots',
                noSlotsAvailable: 'Keine Slots für diese Woche',
                day: 'Tag',
                event: 'Event',
                timeWindow: 'Zeitfenster',
                fullName: 'Vollständiger Name',
                enterName: 'Name, Vorname',
                email: 'E-Mail',
                emailPlaceholder: 'ihre@email.de',
                phone: 'Telefon',
                phonePlaceholder: '+49 (123) 456-7890',
                confirmBooking: 'Buchung Bestätigen',
                cancel: 'Abbrechen',
                bookingConfirmed: 'Buchung bestätigt',
                fillFields: 'Bitte füllen Sie alle Felder aus',
                enterEmail: 'Geben Sie Ihre E-Mail ein',
                yourBookings: 'Ihre Buchungen',
                noBookings: 'Keine Buchungen gefunden',
                cancelBooking: 'Stornieren',
                bookingCancelled: 'Buchung storniert',
                teamleiter: 'Teamleiter',
                participant: 'Teilnehmer',
                role: 'Rolle',
                status: 'Status',
                teamleiterTaken: 'Teamleiter bereits vergeben',
                loading: 'Lade Daten...',
                available: 'Verfügbar',
                booked: 'Gebucht',
                teamleiterFor: 'Teamleiter für',
                errorLoading: 'Fehler beim Laden',
                errorBooking: 'Fehler bei der Buchung',
                weekDays: { 'Mo': 'Montag', 'Di': 'Dienstag', 'Mi': 'Mittwoch', 'Do': 'Donnerstag', 'Fr': 'Freitag', 'Sa': 'Samstag', 'So': 'Sonntag' }
            } : {
                title: 'Event Booking System',
                subtitle: 'Book your participation',
                makeBooking: 'Make Booking',
                manageBookings: 'My Bookings',
                selectWeek: 'Select Week',
                selectKW: 'Select Week',
                allSlots: 'All Slots',
                noSlotsAvailable: 'No slots available',
                day: 'Day',
                event: 'Event',
                timeWindow: 'Time',
                fullName: 'Full Name',
                enterName: 'Last name, First name',
                email: 'Email',
                emailPlaceholder: 'your@email.com',
                phone: 'Phone',
                phonePlaceholder: '+1 (555) 000-0000',
                confirmBooking: 'Confirm Booking',
                cancel: 'Cancel',
                bookingConfirmed: 'Booking confirmed',
                fillFields: 'Please fill all fields',
                enterEmail: 'Enter your email',
                yourBookings: 'Your Bookings',
                noBookings: 'No bookings found',
                cancelBooking: 'Cancel',
                bookingCancelled: 'Booking cancelled',
                teamleiter: 'Team Leader',
                participant: 'Participant',
                role: 'Role',
                status: 'Status',
                teamleiterTaken: 'Team leader taken',
                loading: 'Loading...',
                available: 'Available',
                booked: 'Booked',
                teamleiterFor: 'Team Leader for',
                errorLoading: 'Loading error',
                errorBooking: 'Booking error',
                weekDays: { 'Mo': 'Monday', 'Di': 'Tuesday', 'Mi': 'Wednesday', 'Do': 'Thursday', 'Fr': 'Friday', 'Sa': 'Saturday', 'So': 'Sunday' }
            };

            useEffect(() => {
                loadEvents();
                const savedLang = localStorage.getItem('language');
                if (savedLang) setLanguage(savedLang);
            }, []);

            useEffect(() => {
                localStorage.setItem('language', language);
            }, [language]);

            const loadEvents = async () => {
                setLoading(true);
                try {
                    const res = await fetch(`${API_URL}?action=getEvents`);
                    const data = await res.json();
                    const resT = await fetch(`${API_URL}?action=getTeamleiter`);
                    const dataT = await resT.json();
                    localStorage.setItem('teamleiterData', JSON.stringify(dataT));
                    setEvents(data);
                    setLoading(false);
                } catch (error) {
                    console.error('Error:', error);
                    setMessage({ type: 'error', text: t.errorLoading });
                    setLoading(false);
                }
            };

            const getWeekDateRange = (kw) => {
                const wEvents = events.filter(e => e.kw === kw);
                if (!wEvents.length) return '';
                const dates = wEvents.map(e => {
                    const p = e.date.split('.');
                    return new Date(p[2], p[1] - 1, p[0]);
                }).sort((a, b) => a - b);
                const f = dates[0], l = dates[dates.length - 1];
                return `${f.getDate()}.${f.getMonth() + 1}. - ${l.getDate()}.${l.getMonth() + 1}.`;
            };

            const getAvailableWeeks = () => {
                const weeks = [...new Set(events.map(e => e.kw))].sort((a, b) => parseInt(a) - parseInt(b));
                return weeks.map(kw => ({ kw, dateRange: getWeekDateRange(kw) }));
            };

            const getWeekEvents = (kw) => events.filter(e => e.kw === kw && e.timeWindow);

            const getTeamleiterForWeek = (kw) => {
                const td = JSON.parse(localStorage.getItem('teamleiterData') || '[]');
                return td.find(t => t.kw === kw);
            };

            const isTeamleiterTaken = (kw) => !!getTeamleiterForWeek(kw);

            const handleSlotSelect = (slot) => {
                if (bookingType === 'participant' && slot.name) return;
                setSelectedSlot(slot);
                setMessage({ type: '', text: '' });
            };

            const handleBooking = async () => {
                if (!customerName || !customerEmail || !customerPhone) {
                    setMessage({ type: 'error', text: t.fillFields });
                    return;
                }

                if (bookingType === 'teamleiter') {
                    if (isTeamleiterTaken(selectedWeek)) {
                        setMessage({ type: 'error', text: t.teamleiterTaken });
                        return;
                    }
                    try {
                        await fetch(API_URL, {
                            method: 'POST',
                            body: JSON.stringify({ action: 'bookTeamleiter', kw: selectedWeek, name: customerName, email: customerEmail, phone: customerPhone })
                        });
                        setMessage({ type: 'success', text: `${t.bookingConfirmed}: ${t.teamleiter} KW ${selectedWeek}` });
                        setCustomerName('');
                        setCustomerEmail('');
                        setCustomerPhone('');
                        setBookingType('participant');
                        loadEvents();
                    } catch (error) {
                        setMessage({ type: 'error', text: t.errorBooking });
                    }
                    return;
                }

                if (!selectedSlot) return;
                try {
                    await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'bookSlot', rowIndex: selectedSlot.rowIndex, name: customerName, email: customerEmail, phone: customerPhone })
                    });
                    const booking = { ...selectedSlot, name: customerName, email: customerEmail, phone: customerPhone, role: 'participant', bookedAt: new Date().toISOString() };
                    const sb = JSON.parse(localStorage.getItem('userBookings') || '[]');
                    sb.push(booking);
                    localStorage.setItem('userBookings', JSON.stringify(sb));
                    setMessage({ type: 'success', text: `${t.bookingConfirmed}: ${selectedSlot.day} ${selectedSlot.date}, ${selectedSlot.timeWindow}` });
                    setSelectedSlot(null);
                    setCustomerName('');
                    setCustomerEmail('');
                    setCustomerPhone('');
                    loadEvents();
                } catch (error) {
                    setMessage({ type: 'error', text: t.errorBooking });
                }
            };

            const getUserBookings = () => {
                const sb = JSON.parse(localStorage.getItem('userBookings') || '[]');
                const td = JSON.parse(localStorage.getItem('teamleiterData') || '[]');
                const pb = sb.filter(b => b.email.toLowerCase() === managementEmail.toLowerCase());
                const tb = td.filter(t => t.name && t.name.toLowerCase().includes(managementEmail.toLowerCase().split('@')[0])).map(t => ({ ...t, role: 'teamleiter' }));
                return [...pb, ...tb];
            };

            const handleCancelBooking = async (booking) => {
                try {
                    if (booking.role === 'teamleiter') {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'cancelTeamleiter', kw: booking.kw }) });
                    } else {
                        await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'cancelBooking', rowIndex: booking.rowIndex }) });
                        const sb = JSON.parse(localStorage.getItem('userBookings') || '[]');
                        localStorage.setItem('userBookings', JSON.stringify(sb.filter(b => b.rowIndex !== booking.rowIndex)));
                    }
                    setMessage({ type: 'success', text: t.bookingCancelled });
                    loadEvents();
                } catch (error) {
                    setMessage({ type: 'error', text: t.errorBooking });
                }
            };

            const weekEvents = selectedWeek ? getWeekEvents(selectedWeek) : [];
            const teamleiter = selectedWeek ? getTeamleiterForWeek(selectedWeek) : null;

            if (loading) {
                return (
                    <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mx-auto mb-4"></div>
                            <p className="text-gray-600">{t.loading}</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-4">
                    <div className="max-w-6xl mx-auto">
                        <div className="bg-white rounded-lg shadow-xl p-8">
                            <div className="flex justify-between items-start mb-6">
                                <div>
                                    <h1 className="text-3xl font-bold text-gray-800 mb-2">{t.title}</h1>
                                    <p className="text-gray-600">{t.subtitle}</p>
                                </div>
                                <div className="flex gap-2">
                                    <button onClick={() => setLanguage('de')} className={`px-4 py-2 rounded-lg font-medium ${language === 'de' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>DE</button>
                                    <button onClick={() => setLanguage('en')} className={`px-4 py-2 rounded-lg font-medium ${language === 'en' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>EN</button>
                                </div>
                            </div>

                            <div className="flex gap-2 mb-6">
                                <button onClick={() => setView('book')} className={`px-6 py-2 rounded-lg font-medium ${view === 'book' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>{t.makeBooking}</button>
                                <button onClick={() => setView('manage')} className={`px-6 py-2 rounded-lg font-medium ${view === 'manage' ? 'bg-indigo-600 text-white' : 'bg-gray-200 text-gray-700'}`}>{t.manageBookings}</button>
                            </div>

                            {message.text && (
                                <div className={`mb-6 p-4 rounded-lg ${message.type === 'success' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}`}>
                                    {message.text}
                                </div>
                            )}

                            {view === 'book' && (
                                <div className="space-y-6">
                                    <div className="grid md:grid-cols-2 gap-6">
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">{t.selectWeek}</label>
                                            <select value={selectedWeek} onChange={(e) => { setSelectedWeek(e.target.value); setSelectedSlot(null); }} className="w-full p-3 border border-gray-300 rounded-lg">
                                                <option value="">{t.selectKW}</option>
                                                {getAvailableWeeks().map(w => <option key={w.kw} value={w.kw}>KW {w.kw} ({w.dateRange})</option>)}
                                            </select>
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-2">{t.role}</label>
                                            <div className="grid grid-cols-2 gap-2">
                                                <button onClick={() => setBookingType('participant')} className={`p-3 rounded-lg font-medium ${bookingType === 'participant' ? 'bg-indigo-600 text-white' : 'bg-gray-100 text-gray-700'}`}>{t.participant}</button>
                                                <button onClick={() => { setBookingType('teamleiter'); setSelectedSlot(null); }} disabled={selectedWeek && isTeamleiterTaken(selectedWeek)} className={`p-3 rounded-lg font-medium ${bookingType === 'teamleiter' ? 'bg-indigo-600 text-white' : selectedWeek && isTeamleiterTaken(selectedWeek) ? 'bg-gray-100 text-gray-400' : 'bg-gray-100 text-gray-700'}`}>
                                                    {t.teamleiter}{selectedWeek && isTeamleiterTaken(selectedWeek) && ' ✓'}
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {selectedWeek && teamleiter && (
                                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4">
                                            <p className="text-sm font-medium text-blue-900">👤 {t.teamleiter}: {teamleiter.name}</p>
                                        </div>
                                    )}

                                    {selectedWeek && bookingType === 'teamleiter' && !isTeamleiterTaken(selectedWeek) && (
                                        <div className="border-t pt-6 space-y-6">
                                            <div className="bg-indigo-50 p-4 rounded-lg">
                                                <p className="font-medium text-indigo-900">{t.teamleiterFor} KW {selectedWeek} ({getWeekDateRange(selectedWeek)})</p>
                                            </div>
                                            <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full p-3 border rounded-lg" placeholder={t.enterName} />
                                            <div className="grid md:grid-cols-2 gap-6">
                                                <input type="email" value={customerEmail} onChange={(e) => setCustomerEmail(e.target.value)} className="w-full p-3 border rounded-lg" placeholder={t.emailPlaceholder} />
                                                <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full p-3 border rounded-lg" placeholder={t.phonePlaceholder} />
                                            </div>
                                            <button onClick={handleBooking} className="w-full bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700">{t.confirmBooking}</button>
                                        </div>
                                    )}

                                    {selectedWeek && bookingType === 'participant' && (
                                        <div className="border-t pt-6">
                                            <h3 className="text-xl font-semibold text-gray-800 mb-4">{t.allSlots} - KW {selectedWeek}</h3>
                                            {weekEvents.length === 0 ? (
                                                <p className="text-gray-500">{t.noSlotsAvailable}</p>
                                            ) : (
                                                <div className="grid gap-3">
                                                    {weekEvents.map((slot, idx) => (
                                                        <div key={idx} className={`p-4 border rounded-lg ${slot.name ? 'bg-gray-50' : selectedSlot?.rowIndex === slot.rowIndex ? 'bg-indigo-50 border-indigo-500' : 'bg-white hover:border-indigo-300 cursor-pointer'}`} onClick={() => !slot.name && handleSlotSelect(slot)}>
                                                            <div className="grid grid-cols-5 gap-4">
                                                                <div>
                                                                    <p className="text-xs text-gray-500">{t.day}</p>
                                                                    <p className="font-medium">{t.weekDays[slot.day]}</p>
                                                                    <p className="text-sm text-gray-600">{slot.date}</p>
                                                                </div>
                                                                <div>
                                                                    <p className="text-xs text-gray-500">{t.event}</p>
                                                                    <p className="font-medium text-sm">{slot.event}</p>
                                                                </div>
                                                                <div>
                                                                    <p className="text-xs text-gray-500">{t.timeWindow}</p>
                                                                    <p className="font-medium">{slot.timeWindow}</p>
                                                                </div>
                                                                <div className="col-span-2">
                                                                    <p className="text-xs text-gray-500">{t.status}</p>
                                                                    {slot.name ? (
                                                                        <div>
                                                                            <p className="text-sm font-medium text-red-700">✓ {t.booked}</p>
                                                                            <p className="text-xs text-gray-600">{slot.name}</p>
                                                                        </div>
                                                                    ) : (
                                                                        <span className="px-3 py-1 bg-green-100 text-green-800 rounded-full text-sm font-medium">{t.available}</span>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {selectedSlot && bookingType === 'participant' && (
                                        <div className="border-t pt-6 space-y-6">
                                            <div className="bg-indigo-50 p-4 rounded-lg">
                                                <p className="font-medium">KW {selectedSlot.kw} - {t.weekDays[selectedSlot.day]} {selectedSlot.date}</p>
                                                <p className="text-sm text-gray-700">{selectedSlot.event} • {selectedSlot.timeWindow}</p>
                                            </div>
                                            <input type="text" value={customerName} onChange={(e) => setCustomerName(e.target.value)} className="w-full p-3 border rounded-lg" placeholder={t.enterName} />
                                            <div className="grid md:grid-cols-2 gap-6">
                                                <input type="email" value={customerEmail} onChange={(e) => setCustomerEmail(e.target.value)} className="w-full p-3 border rounded-lg" placeholder={t.emailPlaceholder} />
                                                <input type="tel" value={customerPhone} onChange={(e) => setCustomerPhone(e.target.value)} className="w-full p-3 border rounded-lg" placeholder={t.phonePlaceholder} />
                                            </div>
                                            <div className="flex gap-3">
                                                <button onClick={handleBooking} className="flex-1 bg-indigo-600 text-white py-3 rounded-lg font-medium hover:bg-indigo-700">{t.confirmBooking}</button>
                                                <button onClick={() => setSelectedSlot(null)} className="px-6 bg-gray-200 text-gray-700 py-3 rounded-lg font-medium hover:bg-gray-300">{t.cancel}</button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            )}

                            {view === 'manage' && (
                                <div className="space-y-6">
                                    <input type="email" value={managementEmail} onChange={(e) => setManagementEmail(e.target.value)} placeholder={t.emailPlaceholder} className="w-full p-3 border rounded-lg" />
                                    {managementEmail && (
                                        <div className="space-y-4">
                                            <h3 className="text-xl font-semibold text-gray-800">{t.yourBookings}</h3>
                                            {getUserBookings().length === 0 ? (
                                                <p className="text-gray-500">{t.noBookings}</p>
                                            ) : (
                                                getUserBookings().map((booking, idx) => (
                                                    <div key={idx} className="p-4 border border-green-300 bg-green-50 rounded-lg">
                                                        <div className="flex justify-between items-start">
                                                            <div>
                                                                {booking.role === 'teamleiter' ? (
                                                                    <p className="font-semibold text-gray-800">{t.teamleiter} - KW {booking.kw}</p>
                                                                ) : (
                                                                    <>
                                                                        <p className="font-semibold text-gray-800">KW {booking.kw} - {t.weekDays[booking.day]} {booking.date}</p>
                                                                        <p className="text-gray-700">{booking.event}</p>
                                                                        <p className="text-gray-600">{booking.timeWindow}</p>
                                                                    </>
                                                                )}
                                                            </div>
                                                            <button onClick={() => handleCancelBooking(booking)} className="bg-red-500 text-white px-4 py-2 rounded-lg text-sm hover:bg-red-600">{t.cancelBooking}</button>
                                                        </div>
                                                    </div>
                                                ))
                                            )}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>
                        <div className="mt-6 bg-green-50 border border-green-200 rounded-lg p-4">
                            <h3 className="font-semibold text-green-900 mb-2">✅ Mit Google Sheets verbunden!</h3>
                            <p className="text-sm text-green-800">Alle Buchungen werden direkt in Ihr Google Sheet geschrieben!</p>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
